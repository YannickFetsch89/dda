name: Täglicher Scraper-Lauf

# Die Pipeline läuft hier statt auf dem Server: Im Jail des Timme-Servers fehlen
# Systembibliotheken für Chromium, die Playwright-Scraper starten dort nicht.
on:
  schedule:
    # GitHub rechnet in UTC: 05:00 UTC = 06:00 Uhr (Winterzeit) bzw. 07:00 Uhr (Sommerzeit).
    # Täglich angestoßen, der Job "rhythmus" lässt aber nur jeden 3. Tag durch
    # (ein Cron mit */3 würde am Monatsende springen, z.B. 31. und direkt danach 1.).
    - cron: "0 5 * * *"
  workflow_dispatch:

# Nie zwei Läufe gleichzeitig
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  rhythmus:
    runs-on: ubuntu-latest
    outputs:
      laufen: ${{ steps.pruefen.outputs.laufen }}
    steps:
      - name: Alle 3 Tage laufen (manueller Start immer)
        id: pruefen
        run: |
          tag=$(( $(date -u +%s) / 86400 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( tag % 3 )) -eq 0 ]; then
            echo "laufen=true" >> "$GITHUB_OUTPUT"
          else
            echo "laufen=false" >> "$GITHUB_OUTPUT"
            echo "Heute kein Lauf (nächster in $(( 3 - tag % 3 )) Tag(en))"
          fi

  pipeline:
    needs: rhythmus
    if: needs.rhythmus.outputs.laufen == 'true'
    # 22.04: Playwright 1.44 unterstützt neuere Ubuntu-Versionen noch nicht offiziell
    runs-on: ubuntu-22.04
    # 45 Minuten reichten seit dem 12.11.2026 nicht mehr: Die Läufe brachen in Schritt 3b ab, Club-Scores (3c) und
    # IndexNow (3d) liefen nie. Seit 20.11.2026 holt Schritt 3b alle offenen Beschreibungen (main.py, bis 90 Minuten
    # für Veranstalter-Events plus etwa 25 s je Rausgegangen-Event). Der erste Lauf baut den Rückstand ab und kann
    # über zwei Stunden dauern; danach rund 60–90 Minuten. GitHub erlaubt bis zu 360 Minuten je Job.
    timeout-minutes: 240
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      # Zwischenspeicher des Visit-Düsseldorf-Führungs-Scrapers (je Seite ~1,8 MB) zwischen den Läufen
      # behalten – sonst lädt jeder Lauf alle Führungsseiten neu. Neuer Schlüssel je Lauf, damit der
      # Stand nach dem Lauf gespeichert wird; wiederhergestellt wird der jeweils neueste.
      - name: Zwischenspeicher Visit-Düsseldorf-Führungen
        uses: actions/cache@v4
        with:
          path: data/visitduesseldorf
          key: vd-fuehrungen-${{ github.run_id }}
          restore-keys: vd-fuehrungen-

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Python-Pakete installieren
        run: pip install -r requirements.txt

      - name: Chromium für Playwright installieren
        run: python -m playwright install --with-deps chromium

      - name: Pipeline ausführen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: Website des Veranstaltungsorts für Event-Beschreibungen (ohne Secret nur Websuche)
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # Ortsseiten (Plan Locations 3.11): 1 = neue/geänderte /orte-URLs nach dem Lauf an IndexNow melden
          ORTSSEITEN_MELDEN: ${{ vars.ORTSSEITEN_MELDEN }}
          TZ: Europe/Berlin
        run: |
          mkdir -p logs
          python main.py --jetzt

      - name: Log aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_number }}
          path: logs/pipeline.log
          retention-days: 14
