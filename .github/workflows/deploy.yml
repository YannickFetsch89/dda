name: Deploy auf Server

on:
  push:
    branches:
      - claude/setup-project-structure-5QNOf

# Nie gleichzeitig mit dem Website-Wächter (waechter.yml) – beide starten die Website ggf. neu
concurrency:
  group: website-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auf Server deployen
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # Schalter Nutzerkonten (Plan Nutzerkonten E10, Schritt 8): GitHub → Settings → Secrets and variables →
          # Actions → Variables → KONTEN_AKTIV = 1. Fehlt die Variable oder ist sie nicht „1“, sind die Konten aus.
          KONTEN_AKTIV: ${{ vars.KONTEN_AKTIV }}
          # Schlüssel der internen Magazin-Auswahl-Route (Plan Redaktion T11); derselbe Wert als Secret der Magazin-Action
          MAGAZIN_JOB_SCHLUESSEL: ${{ secrets.MAGAZIN_JOB_SCHLUESSEL }}
          # Geburtstagsmail (Plan Geburtstagsmail G2/G4): Abmelde-Token und interne Tipps-Route; dieselben Werte als
          # Secrets der Action geburtstag.yml
          GEBURTSTAG_TOKEN_SCHLUESSEL: ${{ secrets.GEBURTSTAG_TOKEN_SCHLUESSEL }}
          GEBURTSTAG_JOB_SCHLUESSEL: ${{ secrets.GEBURTSTAG_JOB_SCHLUESSEL }}
          # Admin-Bereich (Plan Admin-Dashboard 3.4, E3): Fine-grained Token nur für dieses Repo,
          # Actions: read and write, Variables: read. Ohne Secret zeigt das Cockpit „GitHub nicht verbunden“.
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          # Newsletter Double-Opt-in (Plan Admin-Dashboard 4.9): Token der Bestätigen- und Abmelde-Links; derselbe Wert
          # als Secret der Action newsletter.yml. Ohne Secret sind alle Links ungültig.
          NEWSLETTER_TOKEN_SCHLUESSEL: ${{ secrets.NEWSLETTER_TOKEN_SCHLUESSEL }}
          # Partner-Links (Plan Quellen-Ausbau 5.5.5, P2): Schalter und öffentliche Kennungen als Variables (keine Secrets –
          # sie stehen in jedem Link). Ohne PARTNERLINKS_AKTIV=1 bleiben alle Ticket-Links normale Links.
          PARTNERLINKS_AKTIV: ${{ vars.PARTNERLINKS_AKTIV }}
          TICKETMASTER_PARTNER_OK: ${{ vars.TICKETMASTER_PARTNER_OK }}
          AWIN_PUBLISHER_ID: ${{ vars.AWIN_PUBLISHER_ID }}
          TICKETMASTER_PARTNER_VORLAGE: ${{ vars.TICKETMASTER_PARTNER_VORLAGE }}
          TIQETS_PARTNER_ID: ${{ vars.TIQETS_PARTNER_ID }}
          GYG_PARTNER_ID: ${{ vars.GYG_PARTNER_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SUPABASE_SERVICE_KEY,GOOGLE_PLACES_API_KEY,KONTEN_AKTIV,MAGAZIN_JOB_SCHLUESSEL,GEBURTSTAG_TOKEN_SCHLUESSEL,GEBURTSTAG_JOB_SCHLUESSEL,ADMIN_GITHUB_TOKEN,NEWSLETTER_TOKEN_SCHLUESSEL,PARTNERLINKS_AKTIV,TICKETMASTER_PARTNER_OK,AWIN_PUBLISHER_ID,TICKETMASTER_PARTNER_VORLAGE,TIQETS_PARTNER_ID,GYG_PARTNER_ID
          script: |
            cd /home/dies_das_duesseldorfadmin/dda

            # --- Diagnose VOR dem Neustart (Zustand der Website, falls sie ausgefallen war) ---
            echo "===== DIAGNOSE: Website-Zustand vor dem Deploy ====="
            echo "--- Antwort auf 127.0.0.1:3847:"; curl -s -o /dev/null -m 5 -w "HTTP %{http_code}\n" http://127.0.0.1:3847/robots.txt || echo "keine Antwort"
            echo "--- PID-Datei:"; cat logs/website.pid 2>/dev/null || echo "fehlt"
            echo "--- Prozess zur PID lebt?"; kill -0 "$(cat logs/website.pid 2>/dev/null)" 2>/dev/null && echo "ja" || echo "nein"
            echo "--- Speicherplatz:"; df -h . 2>/dev/null || true
            echo "--- Größe Logs/.next:"; du -sh logs web/.next 2>/dev/null || true
            echo "--- Arbeitsspeicher:"; free -m 2>/dev/null || cat /proc/meminfo 2>/dev/null | head -3 || echo "nicht verfügbar (Jail)"
            echo "--- Uptime:"; uptime 2>/dev/null || true
            echo "--- Crontab (Wächter):"; crontab -l 2>/dev/null || echo "crontab nicht lesbar"
            echo "--- Wächter-Schleife lebt?"; kill -0 "$(cat logs/website-schleife.pid 2>/dev/null)" 2>/dev/null && echo "ja" || echo "nein"
            echo "--- Herzschlag des Cron-Wächters (letzte 10):"; tail -10 logs/waechter.txt 2>/dev/null || echo "noch keiner"
            echo "--- Herzschlag-Fallback /tmp:"; tail -5 /tmp/dda-waechter.txt 2>/dev/null || echo "keiner"
            echo "--- Letzte Starts laut Log:"; grep -n "Website wird gestartet" logs/website.log 2>/dev/null | tail -5 || true
            echo "--- Letzte 80 Zeilen website.log:"; tail -80 logs/website.log 2>/dev/null || echo "Log fehlt"
            # Zugriffe (Speicherüberlauf 23.11.2026: welche Anfragen kommen kurz vor einem Absturz?). Nur Pfade und Zahlen.
            for ZUGRIFF in /log/access.log ../log/access.log "$HOME/../log/access.log" /var/log/ispconfig/httpd/diesdas.events/access.log; do
              if [ -r "$ZUGRIFF" ]; then
                echo "--- Zugriffs-Log $ZUGRIFF: häufigste Pfade der letzten 3000 Anfragen"
                tail -3000 "$ZUGRIFF" | awk '{print $7}' | sed 's/?.*//' | sort | uniq -c | sort -rn | head -30
                echo "--- Anzahl verschiedener Adressen unter den letzten 3000 Anfragen (nur die Zahl, keine Adressen)"
                tail -3000 "$ZUGRIFF" | awk '{print $1}' | sort -u | wc -l
                echo "--- häufigste Clients (User-Agent) der letzten 3000 Anfragen"
                tail -3000 "$ZUGRIFF" | awk -F'"' '{print $6}' | sort | uniq -c | sort -rn | head -10
                break
              fi
            done
            echo "===== DIAGNOSE ENDE ====="

            set -e

            # SUPABASE_SERVICE_KEY in .env eintragen (falls noch nicht vorhanden)
            if ! grep -q "^SUPABASE_SERVICE_KEY=" .env 2>/dev/null; then
              echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env
              echo "Service Key in .env eingetragen"
            elif [ -n "$SUPABASE_SERVICE_KEY" ]; then
              sed -i "s|^SUPABASE_SERVICE_KEY=.*|SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY|" .env
              echo "Service Key in .env aktualisiert"
            fi

            # GOOGLE_PLACES_API_KEY für die Website (Route /ort-foto) in web/.env.local – nur wenn das Secret gesetzt ist
            if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
              touch web/.env.local
              if grep -q "^GOOGLE_PLACES_API_KEY=" web/.env.local; then
                sed -i "s|^GOOGLE_PLACES_API_KEY=.*|GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY|" web/.env.local
              else
                echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> web/.env.local
              fi
              echo "Google-Places-Key in web/.env.local gesetzt"
            fi

            # SUPABASE_SERVICE_KEY für die Website-Formulare (Newsletter, Event melden) in web/.env.local –
            # nur serverseitig genutzt (web/lib/formulare.ts), der anon-Key darf dort nicht mehr schreiben
            if [ -n "$SUPABASE_SERVICE_KEY" ]; then
              touch web/.env.local
              if grep -q "^SUPABASE_SERVICE_KEY=" web/.env.local; then
                sed -i "s|^SUPABASE_SERVICE_KEY=.*|SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY|" web/.env.local
              else
                echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> web/.env.local
              fi
              echo "Service Key in web/.env.local gesetzt"
            fi

            # Schalter Nutzerkonten in web/.env.local – immer ausdrücklich gesetzt (1 oder 0), damit kein alter Wert
            # auf dem Server stehen bleibt. Die statischen Seiten lesen ihn beim Build, daher vor „npm run build“.
            if [ "$KONTEN_AKTIV" = "1" ]; then KONTEN_WERT=1; else KONTEN_WERT=0; fi
            touch web/.env.local
            if grep -q "^KONTEN_AKTIV=" web/.env.local; then
              sed -i "s|^KONTEN_AKTIV=.*|KONTEN_AKTIV=$KONTEN_WERT|" web/.env.local
            else
              echo "KONTEN_AKTIV=$KONTEN_WERT" >> web/.env.local
            fi
            echo "Nutzerkonten-Schalter: KONTEN_AKTIV=$KONTEN_WERT"

            # Partner-Links (Plan Quellen-Ausbau 5.5.5, P2) in web/.env.local – immer ausdrücklich gesetzt (auch leer), damit
            # kein alter Wert stehen bleibt. Ohne sed: die Ticketmaster-Vorlage enthält „&“ und „/“.
            for NAME in PARTNERLINKS_AKTIV TICKETMASTER_PARTNER_OK AWIN_PUBLISHER_ID TICKETMASTER_PARTNER_VORLAGE TIQETS_PARTNER_ID GYG_PARTNER_ID; do
              WERT=$(printenv "$NAME" | tr -d ' \r\n\t')
              touch web/.env.local
              grep -v "^$NAME=" web/.env.local > web/.env.local.neu || true
              printf '%s=%s\n' "$NAME" "$WERT" >> web/.env.local.neu
              mv web/.env.local.neu web/.env.local
              if [ -n "$WERT" ]; then echo "Partner-Variable $NAME gesetzt"; else echo "Partner-Variable $NAME leer"; fi
            done

            # Schlüssel der Magazin-Auswahl-Route (Plan Redaktion T11) in web/.env.local – vor „npm run build“; nur „envs“
            # reicht nicht, weil web/deploy/website.sh Next ohne die Variablen dieser SSH-Sitzung startet.
            # Ohne Secret bleibt die Route geschlossen (404).
            WERT=$(printf '%s' "$MAGAZIN_JOB_SCHLUESSEL" | tr -d ' \r\n\t')
            if [ -n "$WERT" ]; then
              touch web/.env.local
              grep -v "^MAGAZIN_JOB_SCHLUESSEL=" web/.env.local > web/.env.local.neu || true
              printf 'MAGAZIN_JOB_SCHLUESSEL=%s\n' "$WERT" >> web/.env.local.neu
              mv web/.env.local.neu web/.env.local
              echo "Magazin-Schlüssel in web/.env.local gesetzt (${#WERT} Zeichen)"
            fi

            # Geburtstagsmail (Plan Geburtstagsmail G2/G4): Token-Schlüssel der Abmelde-Routen und Schlüssel der internen
            # Tipps-Route in web/.env.local. Ohne Secret: Abmelde-Links ungültig bzw. Tipps-Route geschlossen (404).
            WERT=$(printf '%s' "$GEBURTSTAG_TOKEN_SCHLUESSEL" | tr -d ' \r\n\t')
            if [ -n "$WERT" ]; then
              touch web/.env.local
              grep -v "^GEBURTSTAG_TOKEN_SCHLUESSEL=" web/.env.local > web/.env.local.neu || true
              printf 'GEBURTSTAG_TOKEN_SCHLUESSEL=%s\n' "$WERT" >> web/.env.local.neu
              mv web/.env.local.neu web/.env.local
              echo "Geburtstag-Token-Schlüssel in web/.env.local gesetzt (${#WERT} Zeichen)"
            fi
            # Newsletter Double-Opt-in (Plan Admin-Dashboard 4.9): Token-Schlüssel der Bestätigen-/Abmelde-Routen
            # Ohne sed (Deploy 23.11.2026 brach mit „unterminated s command“ ab): Leerzeichen und Zeilenumbrüche aus dem
            # Secret entfernen, alte Zeile herausfiltern, neue anhängen.
            NL_SCHLUESSEL=$(printf '%s' "$NEWSLETTER_TOKEN_SCHLUESSEL" | tr -d ' \r\n\t')
            if [ -n "$NL_SCHLUESSEL" ]; then
              touch web/.env.local
              grep -v "^NEWSLETTER_TOKEN_SCHLUESSEL=" web/.env.local > web/.env.local.neu || true
              printf 'NEWSLETTER_TOKEN_SCHLUESSEL=%s\n' "$NL_SCHLUESSEL" >> web/.env.local.neu
              mv web/.env.local.neu web/.env.local
              echo "Newsletter-Token-Schlüssel in web/.env.local gesetzt (${#NL_SCHLUESSEL} Zeichen)"
            fi
            WERT=$(printf '%s' "$GEBURTSTAG_JOB_SCHLUESSEL" | tr -d ' \r\n\t')
            if [ -n "$WERT" ]; then
              touch web/.env.local
              grep -v "^GEBURTSTAG_JOB_SCHLUESSEL=" web/.env.local > web/.env.local.neu || true
              printf 'GEBURTSTAG_JOB_SCHLUESSEL=%s\n' "$WERT" >> web/.env.local.neu
              mv web/.env.local.neu web/.env.local
              echo "Geburtstag-Job-Schlüssel in web/.env.local gesetzt (${#WERT} Zeichen)"
            fi

            # GitHub-Token des Admin-Bereichs (Plan Admin-Dashboard 3.4): nur Zeichen [A-Za-z0-9_], sed-sicher.
            # Ohne Secret zeigt das Cockpit „GitHub nicht verbunden“.
            if [ -n "$ADMIN_GITHUB_TOKEN" ]; then
              touch web/.env.local
              if grep -q "^ADMIN_GITHUB_TOKEN=" web/.env.local; then
                sed -i "s|^ADMIN_GITHUB_TOKEN=.*|ADMIN_GITHUB_TOKEN=$ADMIN_GITHUB_TOKEN|" web/.env.local
              else
                echo "ADMIN_GITHUB_TOKEN=$ADMIN_GITHUB_TOKEN" >> web/.env.local
              fi
              echo "Admin-GitHub-Token in web/.env.local gesetzt"
            fi

            # Umgebungsvariablen für uv/Python
            export LD_LIBRARY_PATH="/home/dies_das_duesseldorfadmin/.local/lib:$LD_LIBRARY_PATH"
            export PATH="/home/dies_das_duesseldorfadmin/.local/bin:$PATH"

            # Neuesten Code holen
            git pull origin claude/setup-project-structure-5QNOf

            # Python-Pakete aktualisieren falls requirements geändert (venv stammt von uv, enthält kein pip)
            uv pip install --python venv/bin/python -q -r requirements.txt

            # Streamlit ist abgeschaltet (Plan Admin-Dashboard 4.11, Stufe 6): einen noch laufenden Prozess über die
            # PID-Datei beenden (im Jail gibt es kein pkill) und das alte Startskript entfernen. Wiederholbar.
            if [ -f logs/dashboard.pid ]; then
              kill "$(cat logs/dashboard.pid)" 2>/dev/null && echo "Altes Dashboard (Streamlit) beendet" || echo "Altes Dashboard lief nicht mehr"
              rm -f logs/dashboard.pid
            fi
            rm -f /home/dies_das_duesseldorfadmin/bin/dashboard.sh

            # Website (Next.js) bauen und neu starten
            # Start-Skript und /proc-Shim liegen im Repo, Cron ruft ~/bin/website.sh auf
            mkdir -p /home/dies_das_duesseldorfadmin/bin
            cp web/deploy/website.sh web/deploy/jail-shim.cjs /home/dies_das_duesseldorfadmin/bin/
            chmod +x /home/dies_das_duesseldorfadmin/bin/website.sh
            # Verzeichnis von node für den Cron-Wächter merken (Cron hat einen kargen PATH)
            dirname "$(command -v node)" > /home/dies_das_duesseldorfadmin/bin/node-pfad
            echo "node für den Wächter: $(cat /home/dies_das_duesseldorfadmin/bin/node-pfad) ($(node -v))"
            cd web
            export NODE_OPTIONS="--require /home/dies_das_duesseldorfadmin/bin/jail-shim.cjs"
            export NEXT_TELEMETRY_DISABLED=1
            # Die Secrets aus „envs“ NICHT an Build und Website vererben: Next bevorzugt Umgebungsvariablen vor
            # web/.env.local, und dort stehen sie bereinigt. Roh enthielt NEWSLETTER_TOKEN_SCHLUESSEL einen Zeilenumbruch –
            # die Website prüfte Bestätigungslinks mit einem anderen Schlüssel als der Mail-Job (Livetest 24.11.2026).
            # So startet Next nach dem Deploy genauso wie nach einem Neustart durch den Wächter (Cron, ohne diese Sitzung).
            unset SUPABASE_SERVICE_KEY GOOGLE_PLACES_API_KEY KONTEN_AKTIV MAGAZIN_JOB_SCHLUESSEL GEBURTSTAG_TOKEN_SCHLUESSEL
            unset GEBURTSTAG_JOB_SCHLUESSEL ADMIN_GITHUB_TOKEN NEWSLETTER_TOKEN_SCHLUESSEL NL_SCHLUESSEL WERT
            unset PARTNERLINKS_AKTIV TICKETMASTER_PARTNER_OK AWIN_PUBLISHER_ID TICKETMASTER_PARTNER_VORLAGE TIQETS_PARTNER_ID GYG_PARTNER_ID NAME
            npm ci --no-audit --no-fund
            npm run build
            /home/dies_das_duesseldorfadmin/bin/website.sh neustart
            sleep 5
            curl -sf -o /dev/null -m 10 http://127.0.0.1:3847/ || { echo "Website antwortet nicht"; tail -20 /home/dies_das_duesseldorfadmin/dda/logs/website.log; exit 1; }

            # Kartendaten (nicht im Git, per scp hochgeladen) – fehlt die Datei, zeigt die Kartenansicht nur einen Hinweis
            if [ ! -s public/karte/region.pmtiles ]; then
              echo "WARNUNG: web/public/karte/region.pmtiles fehlt – Kartenansicht der Guides funktioniert nicht"
            else
              KARTE_STATUS=$(curl -s -o /dev/null -m 10 -r 0-15 -w "%{http_code}" http://127.0.0.1:3847/karte/region.pmtiles || true)
              [ "$KARTE_STATUS" = "206" ] && echo "Kartendaten erreichbar (206)" || echo "WARNUNG: /karte/region.pmtiles liefert HTTP $KARTE_STATUS statt 206"
            fi
            echo "Deployment abgeschlossen"
