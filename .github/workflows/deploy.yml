name: Deploy auf Server

on:
  push:
    branches:
      - claude/setup-project-structure-5QNOf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auf Server deployen
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/dies_das_duesseldorfadmin/dda

            # Umgebungsvariablen für uv/Python
            export LD_LIBRARY_PATH="/home/dies_das_duesseldorfadmin/.local/lib:$LD_LIBRARY_PATH"
            export PATH="/home/dies_das_duesseldorfadmin/.local/bin:$PATH"

            # Neuesten Code holen
            git pull origin claude/setup-project-structure-5QNOf

            # Python-Pakete aktualisieren falls requirements geändert
            /home/dies_das_duesseldorfadmin/dda/venv/bin/pip install -q -r requirements.txt
            /home/dies_das_duesseldorfadmin/dda/venv/bin/pip install -q -r dashboard/requirements.txt

            # Dashboard neu starten
            pkill -f "streamlit run" || true
            sleep 2
            (/home/dies_das_duesseldorfadmin/dda/venv/bin/streamlit run \
              dashboard/app.py \
              --server.port 8502 \
              --server.address 127.0.0.1 \
              --server.headless true \
              >> /home/dies_das_duesseldorfadmin/dda/logs/dashboard.log 2>&1 &)
            echo "Deployment abgeschlossen"
