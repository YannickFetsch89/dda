name: Deploy auf Server

on:
  push:
    branches:
      - claude/setup-project-structure-5QNOf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auf Server deployen
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SUPABASE_SERVICE_KEY,GOOGLE_PLACES_API_KEY
          script: |
            cd /home/dies_das_duesseldorfadmin/dda

            # --- Diagnose VOR dem Neustart (Zustand der Website, falls sie ausgefallen war) ---
            echo "===== DIAGNOSE: Website-Zustand vor dem Deploy ====="
            echo "--- Antwort auf 127.0.0.1:3847:"; curl -s -o /dev/null -m 5 -w "HTTP %{http_code}\n" http://127.0.0.1:3847/robots.txt || echo "keine Antwort"
            echo "--- PID-Datei:"; cat logs/website.pid 2>/dev/null || echo "fehlt"
            echo "--- Prozess zur PID lebt?"; kill -0 "$(cat logs/website.pid 2>/dev/null)" 2>/dev/null && echo "ja" || echo "nein"
            echo "--- Speicherplatz:"; df -h . 2>/dev/null || true
            echo "--- Größe Logs/.next:"; du -sh logs web/.next 2>/dev/null || true
            echo "--- Arbeitsspeicher:"; free -m 2>/dev/null || cat /proc/meminfo 2>/dev/null | head -3 || echo "nicht verfügbar (Jail)"
            echo "--- Uptime:"; uptime 2>/dev/null || true
            echo "--- Crontab (Wächter):"; crontab -l 2>/dev/null || echo "crontab nicht lesbar"
            echo "--- Wächter-Schleife lebt?"; kill -0 "$(cat logs/website-schleife.pid 2>/dev/null)" 2>/dev/null && echo "ja" || echo "nein"
            echo "--- Herzschlag des Cron-Wächters (letzte 10):"; tail -10 logs/waechter.txt 2>/dev/null || echo "noch keiner"
            echo "--- Herzschlag-Fallback /tmp:"; tail -5 /tmp/dda-waechter.txt 2>/dev/null || echo "keiner"
            echo "--- Letzte Starts laut Log:"; grep -n "Website wird gestartet" logs/website.log 2>/dev/null | tail -5 || true
            echo "--- Letzte 80 Zeilen website.log:"; tail -80 logs/website.log 2>/dev/null || echo "Log fehlt"
            echo "===== DIAGNOSE ENDE ====="

            set -e

            # SUPABASE_SERVICE_KEY in .env eintragen (falls noch nicht vorhanden)
            if ! grep -q "^SUPABASE_SERVICE_KEY=" .env 2>/dev/null; then
              echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env
              echo "Service Key in .env eingetragen"
            elif [ -n "$SUPABASE_SERVICE_KEY" ]; then
              sed -i "s|^SUPABASE_SERVICE_KEY=.*|SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY|" .env
              echo "Service Key in .env aktualisiert"
            fi

            # GOOGLE_PLACES_API_KEY für die Website (Route /ort-foto) in web/.env.local – nur wenn das Secret gesetzt ist
            if [ -n "$GOOGLE_PLACES_API_KEY" ]; then
              touch web/.env.local
              if grep -q "^GOOGLE_PLACES_API_KEY=" web/.env.local; then
                sed -i "s|^GOOGLE_PLACES_API_KEY=.*|GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY|" web/.env.local
              else
                echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> web/.env.local
              fi
              echo "Google-Places-Key in web/.env.local gesetzt"
            fi

            # SUPABASE_SERVICE_KEY für die Website-Formulare (Newsletter, Event melden) in web/.env.local –
            # nur serverseitig genutzt (web/lib/formulare.ts), der anon-Key darf dort nicht mehr schreiben
            if [ -n "$SUPABASE_SERVICE_KEY" ]; then
              touch web/.env.local
              if grep -q "^SUPABASE_SERVICE_KEY=" web/.env.local; then
                sed -i "s|^SUPABASE_SERVICE_KEY=.*|SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY|" web/.env.local
              else
                echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> web/.env.local
              fi
              echo "Service Key in web/.env.local gesetzt"
            fi

            # Umgebungsvariablen für uv/Python
            export LD_LIBRARY_PATH="/home/dies_das_duesseldorfadmin/.local/lib:$LD_LIBRARY_PATH"
            export PATH="/home/dies_das_duesseldorfadmin/.local/bin:$PATH"

            # Neuesten Code holen
            git pull origin claude/setup-project-structure-5QNOf

            # Python-Pakete aktualisieren falls requirements geändert (venv stammt von uv, enthält kein pip)
            uv pip install --python venv/bin/python -q -r requirements.txt
            uv pip install --python venv/bin/python -q -r dashboard/requirements.txt

            # Dashboard neu starten (über PID-Datei, im Jail gibt es kein pkill)
            mkdir -p /home/dies_das_duesseldorfadmin/bin
            cp dashboard/dashboard.sh /home/dies_das_duesseldorfadmin/bin/
            chmod +x /home/dies_das_duesseldorfadmin/bin/dashboard.sh
            /home/dies_das_duesseldorfadmin/bin/dashboard.sh neustart
            sleep 5
            curl -sf -o /dev/null -m 10 http://127.0.0.1:8502/_stcore/health || { echo "Dashboard antwortet nicht"; tail -20 /home/dies_das_duesseldorfadmin/dda/logs/dashboard.log; exit 1; }

            # Website (Next.js) bauen und neu starten
            # Start-Skript und /proc-Shim liegen im Repo, Cron ruft ~/bin/website.sh auf
            mkdir -p /home/dies_das_duesseldorfadmin/bin
            cp web/deploy/website.sh web/deploy/jail-shim.cjs /home/dies_das_duesseldorfadmin/bin/
            chmod +x /home/dies_das_duesseldorfadmin/bin/website.sh
            # Verzeichnis von node für den Cron-Wächter merken (Cron hat einen kargen PATH)
            dirname "$(command -v node)" > /home/dies_das_duesseldorfadmin/bin/node-pfad
            echo "node für den Wächter: $(cat /home/dies_das_duesseldorfadmin/bin/node-pfad) ($(node -v))"
            cd web
            export NODE_OPTIONS="--require /home/dies_das_duesseldorfadmin/bin/jail-shim.cjs"
            export NEXT_TELEMETRY_DISABLED=1
            npm ci --no-audit --no-fund
            npm run build
            /home/dies_das_duesseldorfadmin/bin/website.sh neustart
            sleep 5
            curl -sf -o /dev/null -m 10 http://127.0.0.1:3847/ || { echo "Website antwortet nicht"; tail -20 /home/dies_das_duesseldorfadmin/dda/logs/website.log; exit 1; }

            # Kartendaten (nicht im Git, per scp hochgeladen) – fehlt die Datei, zeigt die Kartenansicht nur einen Hinweis
            if [ ! -s public/karte/region.pmtiles ]; then
              echo "WARNUNG: web/public/karte/region.pmtiles fehlt – Kartenansicht der Guides funktioniert nicht"
            else
              KARTE_STATUS=$(curl -s -o /dev/null -m 10 -r 0-15 -w "%{http_code}" http://127.0.0.1:3847/karte/region.pmtiles || true)
              [ "$KARTE_STATUS" = "206" ] && echo "Kartendaten erreichbar (206)" || echo "WARNUNG: /karte/region.pmtiles liefert HTTP $KARTE_STATUS statt 206"
            fi
            echo "Deployment abgeschlossen"
