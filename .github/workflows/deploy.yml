name: Deploy auf Server

on:
  push:
    branches:
      - claude/setup-project-structure-5QNOf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auf Server deployen
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SUPABASE_SERVICE_KEY
          script: |
            set -e
            cd /home/dies_das_duesseldorfadmin/dda

            # SUPABASE_SERVICE_KEY in .env eintragen (falls noch nicht vorhanden)
            if ! grep -q "^SUPABASE_SERVICE_KEY=" .env 2>/dev/null; then
              echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env
              echo "Service Key in .env eingetragen"
            elif [ -n "$SUPABASE_SERVICE_KEY" ]; then
              sed -i "s|^SUPABASE_SERVICE_KEY=.*|SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY|" .env
              echo "Service Key in .env aktualisiert"
            fi

            # Umgebungsvariablen für uv/Python
            export LD_LIBRARY_PATH="/home/dies_das_duesseldorfadmin/.local/lib:$LD_LIBRARY_PATH"
            export PATH="/home/dies_das_duesseldorfadmin/.local/bin:$PATH"

            # Neuesten Code holen
            git pull origin claude/setup-project-structure-5QNOf

            # Python-Pakete aktualisieren falls requirements geändert (venv stammt von uv, enthält kein pip)
            uv pip install --python venv/bin/python -q -r requirements.txt
            uv pip install --python venv/bin/python -q -r dashboard/requirements.txt

            # Dashboard neu starten (über PID-Datei, im Jail gibt es kein pkill)
            mkdir -p /home/dies_das_duesseldorfadmin/bin
            cp dashboard/dashboard.sh /home/dies_das_duesseldorfadmin/bin/
            chmod +x /home/dies_das_duesseldorfadmin/bin/dashboard.sh
            /home/dies_das_duesseldorfadmin/bin/dashboard.sh neustart
            sleep 5
            curl -sf -o /dev/null -m 10 http://127.0.0.1:8502/_stcore/health || { echo "Dashboard antwortet nicht"; tail -20 /home/dies_das_duesseldorfadmin/dda/logs/dashboard.log; exit 1; }

            # Website (Next.js) bauen und neu starten
            # Start-Skript und /proc-Shim liegen im Repo, Cron ruft ~/bin/website.sh auf
            mkdir -p /home/dies_das_duesseldorfadmin/bin
            cp web/deploy/website.sh web/deploy/jail-shim.cjs /home/dies_das_duesseldorfadmin/bin/
            chmod +x /home/dies_das_duesseldorfadmin/bin/website.sh
            cd web
            export NODE_OPTIONS="--require /home/dies_das_duesseldorfadmin/bin/jail-shim.cjs"
            export NEXT_TELEMETRY_DISABLED=1
            npm ci --no-audit --no-fund
            npm run build
            /home/dies_das_duesseldorfadmin/bin/website.sh neustart
            sleep 5
            curl -sf -o /dev/null -m 10 http://127.0.0.1:3847/ || { echo "Website antwortet nicht"; tail -20 /home/dies_das_duesseldorfadmin/dda/logs/website.log; exit 1; }
            echo "Deployment abgeschlossen"
