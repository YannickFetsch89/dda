{"@context":"https://schema.org","@type":"Event","name":"The Spitfires","startDate":"2026-12-06T00:00:00+01:00","eventStatus":"https://schema.org/EventScheduled","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","location":{"@type":"Place","name":null},"image":["https://www.concertteam.de/media/pages/events/the-spitfires-2026-12-06/dddb03352a-1786362486/the-spitfires.webp"],"description":{"value":"<p>The Spitfires (UK)<br>sind eine britische Band, die für ihre energiegeladenen Auftritte, prägnanten Melodien und ihren dynamischen Sound bekannt ist. <br>Im Laufe der Jahre veröffentlichten The Spitfires eine Reihe von gut aufgenommenen Alben - Response (2015), A Thousand Times (2016), Year Zero (2018), Life Worth Living (2020) und Play For Today (2022). Die Band tourte ausgiebig und erwarb sich einen Ruf für ihre elektrisierenden Live-Shows und ihre Fähigkeit, durch ihre raue, ehrliche Musik eine Verbindung zum Publikum herzustellen. Ihre Songs spiegeln seit jeher eine tiefe Verbundenheit mit den Themen des persönlichen und sozialen Wandels wider und erforschen oft die Komplexität des modernen Lebens.<br>2025 haben sich The Spitfires mit einem neuen Line-up frisch formiert und werden nicht nur ihr neues Material mit alten und neuen Fans teilen. Mit einem neuen Ziel vor Augen und einer kühnen neuen Richtung ist die Band bereit, mit einem Sound zurückzukehren, der so kraftvoll und relevant wie eh und je zu sein verspricht</p>"},"offers":{"@type":"Offer","url":"https://www.eventim-light.com/de/a/58ad58a2ffb88904c6e2c300/e/6a2a9b6247748daf04d8c064","price":"22,88","priceCurrency":"EUR","availability":"https://schema.org/InStock","validFrom":"2026-12-06T00:00:00+01:00"},"performer":[{"@type":"MusicGroup","name":"The Spitfires"}],"organizer":{"@type":"Organization","name":"concertteam nrw","url":"https://concertteam.de"}}</script>
